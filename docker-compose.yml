# Run the site locally:   docker compose up -d     then open http://localhost:8080
# Stop it:                docker compose stop
# Start from a fresh database (deletes all local data):  docker compose down -v
name: hostelmania

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: onlinefoodphp
    volumes:
      - db-data:/var/lib/mysql
      # imported automatically the first time the database starts
      - "./HostelMania-PHP/DATABASE FILE/onlinefoodphp.sql:/docker-entrypoint-initdb.d/onlinefoodphp.sql:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  web:
    build: ./docker
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # the project folder is used directly, so code changes show up on refresh
      - ./HostelMania-PHP:/var/www/html
      - ./docker/config.php:/var/www/html/connection/config.php:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
